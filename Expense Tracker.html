<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Manager</title>
    <style>
        * {	
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .tab:hover, .tab.active {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
        }
        
        .panel {
            display: none;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        
        .panel.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00d9ff;
        }
        
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        button[type="submit"], .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button[type="submit"]:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
        }
        
        .btn-danger {
            background: #ff4757;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.85rem;
            width: auto;
        }
        
        .expense-list {
            margin-top: 20px;
        }
        
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .expense-info {
            flex: 1;
            min-width: 200px;
        }
        
        .expense-desc {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .expense-meta {
            color: #888;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        
        .expense-amount {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00ff88;
            min-width: 100px;
            text-align: right;
        }
        
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(0, 217, 255, 0.2);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #00d9ff;
        }
        
        .report-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00ff88;
        }
        
        .summary-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .chart-container {
            margin-top: 20px;
        }
        
        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .chart-label {
            width: 120px;
            font-size: 0.9rem;
        }
        
        .chart-bar-bg {
            flex: 1;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            margin: 0 10px;
        }
        
        .chart-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border-radius: 12px;
            transition: width 0.5s ease;
        }
        
        .chart-value {
            width: 80px;
            text-align: right;
            font-size: 0.9rem;
            color: #00ff88;
        }
        
        .date-range {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .date-range .form-group {
            flex: 1;
            min-width: 150px;
            margin-bottom: 0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .message {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        
        .message.error {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 600px) {
            .expense-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .expense-amount {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Expense Manager</h1>
        
        <div class="tabs">
            <button class="tab active" data-tab="add">Add Expense</button>
            <button class="tab" data-tab="view">View Expenses</button>
            <button class="tab" data-tab="report">Reports</button>
        </div>
        
        <div id="message"></div>
        
        <!-- Add Expense Panel -->
        <div id="add" class="panel active">
            <form id="expense-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="What did you spend on?" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category...</option>
                        <option value="Food & Dining">🍔 Food & Dining</option>
                        <option value="Transportation">🚗 Transportation</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Bills & Utilities">💡 Bills & Utilities</option>
                        <option value="Healthcare">🏥 Healthcare</option>
                        <option value="Education">📚 Education</option>
                        <option value="Travel">✈️ Travel</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
                
                <button type="submit">Add Expense</button>
            </form>
        </div>
        
        <!-- View Expenses Panel -->
        <div id="view" class="panel">
            <div id="expenses-loading" class="loading">
                <div class="spinner"></div>
                Loading expenses...
            </div>
            <div id="expenses-list" class="expense-list"></div>
        </div>
        
        <!-- Reports Panel -->
        <div id="report" class="panel">
            <div class="date-range">
                <div class="form-group">
                    <label for="start-date">From</label>
                    <input type="date" id="start-date">
                </div>
                <div class="form-group">
                    <label for="end-date">To</label>
                    <input type="date" id="end-date">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn" onclick="generateReport()">Generate Report</button>
                </div>
            </div>
            
            <div id="report-loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                Generating report...
            </div>
            
            <div id="report-content"></div>
        </div>
    </div>

    <script>
        // IMPORTANT: Replace this with your Google Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxr9IZuZ5m9oK7e66NwMMvWOunS5NJi11mQPqSVuVYb8siK_C755zwRoATdF4zQGM6fDA/exec';
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                
                if (tab.dataset.tab === 'view') {
                    loadExpenses();
                }
            });
        });
        
        // Set default dates
        document.getElementById('date').valueAsDate = new Date();
        
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('start-date').valueAsDate = firstDay;
        document.getElementById('end-date').valueAsDate = today;
        
        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => msg.innerHTML = '', 4000);
        }
        
        // Add expense
        document.getElementById('expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                action: 'add',
                date: document.getElementById('date').value,
                description: document.getElementById('description').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value
            };
            
            try {
                const url = `${SCRIPT_URL}?${new URLSearchParams(data)}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Expense added successfully!', 'success');
                    document.getElementById('expense-form').reset();
                    document.getElementById('date').valueAsDate = new Date();
                } else {
                    showMessage('Error: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
            }
        });
        
        // Load expenses
        async function loadExpenses() {
            const loading = document.getElementById('expenses-loading');
            const list = document.getElementById('expenses-list');
            
            loading.style.display = 'block';
            list.innerHTML = '';
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=get`);
                const result = await response.json();
                
                loading.style.display = 'none';
                
                if (result.expenses && result.expenses.length > 0) {
                    const sorted = result.expenses.sort((a, b) => 
                        new Date(b.date) - new Date(a.date)
                    );
                    
                    list.innerHTML = sorted.map(exp => `
                        <div class="expense-item">
                            <div class="expense-info">
                                <div class="expense-desc">${escapeHtml(exp.description)}</div>
                                <div class="expense-meta">
                                    ${formatDate(exp.date)} · 
                                    <span class="category-badge">${escapeHtml(exp.category)}</span>
                                </div>
                            </div>
                            <div class="expense-amount">$${parseFloat(exp.amount).toFixed(2)}</div>
                            <button class="btn btn-danger" onclick="deleteExpense('${exp.id}')">Delete</button>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">No expenses yet. Add your first expense!</div>';
                }
            } catch (error) {
                loading.style.display = 'none';
                list.innerHTML = '<div class="empty-state">Error loading expenses. Please try again.</div>';
            }
        }
        
        // Delete expense
        async function deleteExpense(id) {
            if (!confirm('Delete this expense?')) return;
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=delete&id=${id}`);
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Expense deleted!', 'success');
                    loadExpenses();
                } else {
                    showMessage('Error deleting expense', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        }
        
        // Generate report
        async function generateReport() {
            const loading = document.getElementById('report-loading');
            const content = document.getElementById('report-content');
            
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            if (!startDate || !endDate) {
                showMessage('Please select date range', 'error');
                return;
            }
            
            loading.style.display = 'block';
            content.innerHTML = '';
            
            try {
                const url = `${SCRIPT_URL}?action=report&startDate=${startDate}&endDate=${endDate}`;
                const response = await fetch(url);
                const result = await response.json();
                
                loading.style.display = 'none';
                
                if (result.error) {
                    content.innerHTML = `<div class="empty-state">${result.error}</div>`;
                    return;
                }
                
                // Summary cards
                let html = `
                    <div class="report-summary">
                        <div class="summary-card">
                            <div class="summary-value">$${result.total.toFixed(2)}</div>
                            <div class="summary-label">Total Spent</div>
                        </div>
                        <div class="summary-card">
                            <div class="summary-value">${result.count}</div>
                            <div class="summary-label">Transactions</div>
                        </div>
                        <div class="summary-card">
                            <div class="summary-value">$${result.count > 0 ? (result.total / result.count).toFixed(2) : '0.00'}</div>
                            <div class="summary-label">Average</div>
                        </div>
                    </div>
                `;
                
                // Category breakdown
                const categories = Object.entries(result.byCategory).sort((a, b) => b[1] - a[1]);
                const maxAmount = categories.length > 0 ? categories[0][1] : 1;
                
                if (categories.length > 0) {
                    html += `<h3 style="margin: 20px 0 15px;">Spending by Category</h3>`;
                    html += '<div class="chart-container">';
                    
                    categories.forEach(([cat, amount]) => {
                        const percent = (amount / maxAmount) * 100;
                        html += `
                            <div class="chart-bar">
                                <div class="chart-label">${escapeHtml(cat)}</div>
                                <div class="chart-bar-bg">
                                    <div class="chart-bar-fill" style="width: ${percent}%"></div>
                                </div>
                                <div class="chart-value">$${amount.toFixed(2)}</div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }
                
                // Monthly breakdown
                const months = Object.entries(result.byMonth).sort((a, b) => a[0].localeCompare(b[0]));
                
                if (months.length > 1) {
                    const maxMonth = Math.max(...months.map(m => m[1]));
                    
                    html += `<h3 style="margin: 30px 0 15px;">Spending by Month</h3>`;
                    html += '<div class="chart-container">';
                    
                    months.forEach(([month, amount]) => {
                        const percent = (amount / maxMonth) * 100;
                        const monthLabel = new Date(month + '-01').toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                        html += `
                            <div class="chart-bar">
                                <div class="chart-label">${monthLabel}</div>
                                <div class="chart-bar-bg">
                                    <div class="chart-bar-fill" style="width: ${percent}%"></div>
                                </div>
                                <div class="chart-value">$${amount.toFixed(2)}</div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }
                
                content.innerHTML = html;
                
            } catch (error) {
                loading.style.display = 'none';
                content.innerHTML = '<div class="empty-state">Error generating report</div>';
            }
        }
        
        // Helpers
        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric'
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
