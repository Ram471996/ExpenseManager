<!DOCTYPE html>
<html>
<head>
  <title>Expense Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; max-width: 900px; margin: auto; }
    input, select, button { margin: 5px; padding: 8px; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    h2 { text-align: center; }
  </style>
</head>

<body>
  <h2>Expense Manager</h2>

  <div>
    <input type="date" id="date">
    <input type="text" id="desc" placeholder="Description">
    <input type="number" id="amount" placeholder="Amount">
    <select id="type">
      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Other</option>
    </select>
    <button onclick="addExpense()">Add Expense</button>
  </div>

  <h3 id="total"></h3>

  <table id="table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Amount</th>
        <th>Type</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <canvas id="chart" height="120"></canvas>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzPaEPpbT27fIi7_JbYTzMLrt4eYk4PL4A-5CcpcIzMkF6Ees6CWuCWwHBjNeBcI1b8OQ/exec";

let expenses = [];
let chart;

// Add expense
async function addExpense() {
  const date = document.getElementById('date').value;
  const desc = document.getElementById('desc').value;
  const amount = document.getElementById('amount').value;
  const type = document.getElementById('type').value;

  if (!date || !desc || !amount) {
    alert("Please fill all fields");
    return;
  }

  const data = { date, desc, amount, type };

  await fetch(scriptURL, {
    method: 'POST',
    mode: 'cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  loadExpenses();
}

// Load expenses
async function loadExpenses() {
  const res = await fetch(scriptURL);
  const data = await res.json();
  expenses = data;

  renderTable();
  renderChart();
  renderTotal();
}

// Table
function renderTable() {
  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML = '';

  expenses.forEach(e => {
    const row = `<tr>
      <td>${e.date}</td>
      <td>${e.desc}</td>
      <td>₹${e.amount}</td>
      <td>${e.type}</td>
    </tr>`;
    tbody.innerHTML += row;
  });
}

// Total
function renderTotal() {
  const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
  document.getElementById('total').innerText = `Total Spent: ₹${total}`;
}

// Chart
function renderChart() {
  const totals = {};
  expenses.forEach(e => {
    totals[e.type] = (totals[e.type] || 0) + Number(e.amount);
  });

  const ctx = document.getElementById('chart').getContext('2d');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: Object.keys(totals),
      datasets: [{ data: Object.values(totals) }]
    }
  });
}

loadExpenses();
</script>

</body>
</html>
